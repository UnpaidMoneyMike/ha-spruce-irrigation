run_zone:
  target:
    entity:
      integration: spruce_irrigation
      domain: valve
  fields:
    minutes:
      selector:
        number:
          min: 0.5
          max: 240
          step: 0.5
          unit_of_measurement: min
stop_zone:
  target:
    entity:
      integration: spruce_irrigation
      domain: valve
run_all_zones:
  fields:
    device_id: &device
      selector:
        device:
          integration: spruce_irrigation
    minutes:
      required: true
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
run_schedule:
  fields:
    device_id: *device
    schedule:
      required: true
      selector:
        text:
stop_schedule:
  fields:
    device_id: *device
    schedule:
      required: true
      selector:
        text:
stop:
  fields:
    device_id: *device
set_hibernate:
  fields:
    device_id: *device
    enabled:
      required: true
      selector:
        boolean:
    until:
      selector:
        date:
pause_schedules:
  fields:
    device_id: *device
    days:
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: d
    until:
      selector:
        date:
pair_sensor:
  fields:
    device_id: *device
import_history:
  fields:
    device_id: *device
    start_date:
      selector:
        date:
set_schedule_zone:
  fields:
    device_id: *device
    schedule:
      required: true
      selector:
        text:
    zone:
      required: true
      selector:
        text:
    watering_percent:
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "%"
    enabled:
      selector:
        boolean:
    rain_skip:
      selector:
        boolean:
    freeze_skip:
      selector:
        boolean:
    wind_skip:
      selector:
        boolean:
run_baseline:
  fields:
    device_id: *device
record_baseline:
  fields:
    device_id: *device
    date:
      required: true
      selector:
        date:
    flows:
      required: true
      example: '{"1": 16.07, "Front Low": 18.74}'
      selector:
        object:
    unit:
      selector:
        select:
          options:
            - "L/min"
            - "gal/min"
    note:
      selector:
        text:
review_baseline:
  fields:
    device_id: *device
    accept:
      required: true
      selector:
        boolean:
    zones:
      selector:
        text:
          multiple: true
set_zone_heads:
  fields:
    device_id: *device
    zone:
      required: true
      selector:
        text:
    heads:
      required: true
      example: '[{"model": "Hunter MP Rotator MP2000", "arc": 90, "quantity": 2}]'
      selector:
        object:
