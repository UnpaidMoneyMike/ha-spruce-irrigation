run_zone:
  target:
    entity:
      integration: spruce_irrigation
      domain: valve
  fields:
    minutes:
      selector:
        number:
          min: 0.5
          max: 240
          step: 0.5
          unit_of_measurement: min
stop_zone:
  target:
    entity:
      integration: spruce_irrigation
      domain: valve
run_all_zones:
  fields:
    device_id: &device
      selector:
        device:
          integration: spruce_irrigation
    minutes:
      required: true
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
run_schedule:
  fields:
    device_id: *device
    schedule:
      required: true
      selector:
        text:
stop_schedule:
  fields:
    device_id: *device
    schedule:
      required: true
      selector:
        text:
stop:
  fields:
    device_id: *device
set_hibernate:
  fields:
    device_id: *device
    enabled:
      required: true
      selector:
        boolean:
pair_sensor:
  fields:
    device_id: *device
import_history:
  fields:
    device_id: *device
    start_date:
      selector:
        date:
set_schedule_zone:
  fields:
    device_id: *device
    schedule:
      required: true
      selector:
        text:
    zone:
      required: true
      selector:
        text:
    watering_percent:
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: "%"
    enabled:
      selector:
        boolean:
